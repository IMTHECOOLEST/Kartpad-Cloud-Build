name: Mac player Python

# Mac players start PadMint.command, which runs Apple's /usr/bin/python3 (3.9). Other jobs
# use a newer Python, so code that only works there would pass them and fail for players.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            machine: arm64
          - os: macos-15-intel
            machine: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run every test on Apple's Python
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -B -m unittest discover -s tests
      - name: Check the extracted Mac launcher and real host menu
        run: /usr/bin/python3 -B scripts/check-macos-launch.py --expect-machine ${{ matrix.machine }}
